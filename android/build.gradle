plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'sincpro.expo.printer'
version = '2.0.0'

android {
  namespace "sincpro.expo.printer"
  defaultConfig {
    versionCode 1
    versionName "2.0.0"
    // Expo SDK 58 enables R8 in release builds; these rules keep the Bixolon SDK and its JNI bindings.
    consumerProguardFiles 'proguard-rules.pro'
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Bixolon Label SDK 2.1.2 (libcommon 1.4.5); native libbxl_common.so lives in src/main/jniLibs.
  implementation fileTree(dir: 'libs', include: ['*.jar'])
}
